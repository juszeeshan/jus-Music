<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Jus Music</title>
<style>
:root{--bg:#050505;--s1:#0f0f10;--s2:#18181a;--t:#f4f4f5;--soft:#9a9aa0;--shine:linear-gradient(135deg,#fff,#555 35%,#ddd 60%,#444)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Roboto,Arial,sans-serif;padding-bottom:150px}
button,input,select{font:inherit;color:inherit}
.glass{position:relative;background:linear-gradient(160deg,#1c1c1e,#0a0a0b);border-radius:14px;border:1px solid transparent;
 background-clip:padding-box;box-shadow:0 8px 24px #000a,inset 0 1px 0 #fff2}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:15px;z-index:-1;background:var(--shine)}
.btn{border:0;border-radius:12px;padding:10px 16px;background:linear-gradient(180deg,#fff,#b9b9bd);color:#000;font-weight:650;cursor:pointer}
.btn.ghost{background:var(--s2);color:var(--t);border:1px solid #444}
.btn:active{transform:scale(.96)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #444;background:var(--s1);outline:none}
input:focus,select:focus{border-color:#fff}
#auth{max-width:380px;margin:12vh auto;padding:0 18px}
#auth .glass{padding:22px;display:grid;gap:12px}
h1{margin:0;text-align:center;letter-spacing:-1px;background:linear-gradient(90deg,#fff,#777,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
#err{color:#ff8a8a;min-height:18px;font-size:14px;text-align:center}
header{position:sticky;top:0;z-index:5;background:#000d;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid #333}
.row{display:flex;gap:8px;align-items:center;max-width:900px;margin:auto}
.row h1{font-size:22px;text-align:left;flex:1}
main{max-width:900px;margin:auto;padding:12px 14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.song{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
.song.on{box-shadow:0 0 0 1px #fff,0 0 18px #fff3}
.num{width:26px;color:var(--soft);font-size:13px;text-align:center}
.info{flex:1;min-width:0}
.info b,.info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--soft)}
.tag{font-size:11px;color:var(--soft);border:1px solid #444;border-radius:9px;padding:2px 7px}
.ic{background:none;border:0;font-size:18px;cursor:pointer;padding:6px}
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:700px;margin:auto;padding:12px;z-index:9}
#bar .t{text-align:center;margin-bottom:6px}
#bar .t b,#bar .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar small{color:var(--soft)}
.ctl{display:flex;justify-content:center;gap:22px;align-items:center;margin-top:6px}
.ctl .btn{width:54px;height:54px;border-radius:50%;padding:0;font-size:22px}
.ctl .ic{font-size:26px}
input[type=range]{padding:0;height:22px;accent-color:#fff;background:none;border:0}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
dialog{border:0;padding:0;background:none;color:var(--t);width:min(420px,94vw)}
dialog::backdrop{background:#000b}
dialog .glass{padding:18px;display:grid;gap:10px}
.hide{display:none!important}
#empty{text-align:center;color:var(--soft);padding:40px 0}
</style></head>
<body>

<div id="auth" class="hide">
 <div class="glass"><h1>🎵 Jus Music</h1>
  <input id="u" placeholder="Username" autocomplete="username" autocapitalize="none">
  <input id="p" type="password" placeholder="Password" autocomplete="current-password">
  <div id="err"></div>
  <button class="btn" id="login">Login</button>
  <button class="btn ghost" id="reg">Create account</button>
 </div>
</div>

<div id="app" class="hide">
 <header><div class="row">
  <h1>Jus Music</h1>
  <button class="btn ghost" id="upBtn">⬆️</button>
  <button class="btn ghost" id="outBtn" title="Logout">⏻</button>
 </div>
 <div class="row" style="margin-top:10px"><input id="q" placeholder="🔍 Search title or artist"></div></header>
 <main>
  <div class="filters"><select id="fl"></select><select id="fg"></select></div>
  <div id="list"></div><div id="empty" class="hide">No songs yet. Tap ⬆️ to upload.</div>
 </main>
 <div id="bar" class="glass">
  <div class="t"><b id="nt">Nothing playing</b><small id="na">—</small></div>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl"><button class="ic" id="prev">⏮</button><button class="btn" id="pp">▶</button><button class="ic" id="next">⏭</button></div>
 </div>
</div>

<dialog id="dlg"><div class="glass">
 <h3 style="margin:0">Upload song</h3>
 <input type="file" id="file" accept="audio/*">
 <input id="ti" placeholder="Title"><input id="ar" placeholder="Artist">
 <select id="ul"></select><select id="ug"></select>
 <select id="uv"><option value="shared">🌍 Shared with everyone</option><option value="private">🔒 Personal (only me)</option></select>
 <div id="us" style="color:var(--soft);font-size:14px;min-height:18px"></div>
 <div style="display:flex;gap:8px"><button class="btn" id="go" style="flex:1">Upload</button><button class="btn ghost" id="cl">Close</button></div>
</div></dialog>

<audio id="au" preload="metadata"></audio>

<script>
// >>> PASTE YOUR APPS SCRIPT WEB APP URL HERE <<<
const API = "PASTE_WEB_APP_URL_HERE";

const LANGS = ["Telugu","Hindi","Tamil","English","Other"];
const GENRES = ["Pop","Melody","Folk","Rock","Classical","Devotional","Hip-hop","Romantic","Party","Other"];
const $ = id => document.getElementById(id);
let token = localStorage.getItem("jm_token"), me = null, songs = [], view = [], idx = -1;
const au = $("au");

async function call(action, data = {}) {
  try {
    const r = await fetch(API, { method: "POST", body: JSON.stringify({ action, token, ...data }) }); // text/plain = no CORS preflight
    const j = await r.json();
    if (j.auth) logout();
    return j;
  } catch (e) { return { ok: false, error: "Network error" }; }
}
const fill = (el, arr, first) => el.innerHTML = (first ? `<option value="">${first}</option>` : "") + arr.map(x => `<option>${x}</option>`).join("");
fill($("fl"), LANGS, "All languages"); fill($("fg"), GENRES, "All genres");
fill($("ul"), LANGS); fill($("ug"), GENRES);

/* ---- auth ---- */
async function authGo(action) {
  $("err").textContent = "Please wait...";
  const j = await call(action, { username: $("u").value, password: $("p").value });
  if (!j.ok) { $("err").textContent = j.error; return; }
  token = j.token; localStorage.setItem("jm_token", token); start();
}
$("login").onclick = () => authGo("login");
$("reg").onclick = () => authGo("register");
function logout() { localStorage.removeItem("jm_token"); token = null; au.pause(); $("app").classList.add("hide"); $("auth").classList.remove("hide"); $("err").textContent = ""; }
$("outBtn").onclick = logout;

async function start() {
  const j = await call("list");
  if (!j.ok) { logout(); return; }
  me = j.me; songs = j.songs;
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  render();
}

/* ---- list ---- */
function render() {
  const q = $("q").value.toLowerCase(), l = $("fl").value, g = $("fg").value, cur = view[idx] && view[idx].id;
  view = songs.filter(s => (!q || (s.title + " " + s.artist).toLowerCase().includes(q)) && (!l || s.language === l) && (!g || s.genre === g))
              .sort((a, b) => a.added - b.added);
  idx = view.findIndex(s => s.id === cur);
  $("empty").classList.toggle("hide", view.length > 0);
  $("list").innerHTML = view.map((s, i) => {
    const can = s.owner === me.name || me.role === "admin";
    return `<div class="song glass ${i === idx ? "on" : ""}" data-i="${i}">
      <span class="num">${i + 1}</span>
      <div class="info"><b>${esc(s.title)}</b><small>${esc(s.artist)} · ${s.language} · ${s.genre}${s.visibility === "private" ? " · 🔒" : ""}</small></div>
      ${can ? `<button class="ic" data-del="${s.id}" title="Delete">🗑️</button>` : ""}</div>`;
  }).join("");
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
["q", "fl", "fg"].forEach(i => $(i).oninput = render);
$("list").onclick = async e => {
  const d = e.target.dataset.del;
  if (d) {
    if (!confirm("Delete this song?")) return;
    const j = await call("delete", { id: d });
    if (j.ok) { songs = songs.filter(s => s.id !== d); render(); } else alert(j.error);
    return;
  }
  const row = e.target.closest(".song");
  if (row) play(+row.dataset.i);
};

/* ---- player ---- */
function play(i) {
  if (!view.length) return;
  idx = (i + view.length) % view.length; // loop 1→2→3→1
  const s = view[idx];
  au.src = "https://drive.google.com/uc?export=download&id=" + s.fileId;
  au.play().catch(() => {});
  $("nt").textContent = s.title; $("na").textContent = s.artist;
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist, album: "Jus Music" });
    navigator.mediaSession.setActionHandler("nexttrack", () => play(idx + 1));
    navigator.mediaSession.setActionHandler("previoustrack", () => play(idx - 1));
  }
  render();
}
$("next").onclick = () => play(idx + 1);
$("prev").onclick = () => play(idx - 1);
$("pp").onclick = () => { if (idx < 0) play(0); else au.paused ? au.play() : au.pause(); };
au.onplay = () => $("pp").textContent = "⏸";
au.onpause = () => $("pp").textContent = "▶";
au.onended = () => play(idx + 1);
au.onerror = () => { if (idx >= 0) setTimeout(() => play(idx + 1), 1500); };
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "0:00";
au.ontimeupdate = () => { $("cur").textContent = fmt(au.currentTime); $("dur").textContent = fmt(au.duration); if (au.duration) $("seek").value = au.currentTime / au.duration * 100; };
$("seek").oninput = e => { if (au.duration) au.currentTime = e.target.value / 100 * au.duration; };

/* ---- upload ---- */
function guess(text) {
  if (/[\u0C00-\u0C7F]/.test(text)) return ["Telugu", null];
  if (/[\u0900-\u097F]/.test(text)) return ["Hindi", null];
  if (/[\u0B80-\u0BFF]/.test(text)) return ["Tamil", null];
  const t = text.toLowerCase(); let g = null;
  if (/devotional|bhakti|bhajan|stotram|gayatri/.test(t)) g = "Devotional";
  else if (/folk|janapada/.test(t)) g = "Folk";
  else if (/classical|carnatic/.test(t)) g = "Classical";
  else if (/rap|hip.?hop/.test(t)) g = "Hip-hop";
  else if (/love|prema|ishq|pyar/.test(t)) g = "Romantic";
  else if (/party|dj|remix/.test(t)) g = "Party";
  return [/^[\x00-\x7F]*$/.test(text) ? null : "Other", g];
}
$("upBtn").onclick = () => $("dlg").showModal();
$("cl").onclick = () => $("dlg").close();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const name = f.name.replace(/\.[^.]+$/, "").replace(/[_]+/g, " ");
  const parts = name.split(" - ");
  $("ar").value = parts.length > 1 ? parts[0].trim() : "";
  $("ti").value = (parts.length > 1 ? parts.slice(1).join(" - ") : name).trim();
  const [l, g] = guess(name); if (l) $("ul").value = l; if (g) $("ug").value = g;
};
$("go").onclick = async () => {
  const f = $("file").files[0], us = $("us");
  if (!f) { us.textContent = "Choose an audio file"; return; }
  if (f.size > 20 * 1048576) { us.textContent = "Max 20 MB"; return; }
  $("go").disabled = true; us.textContent = "Reading file...";
  const buf = await f.arrayBuffer();
  const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", buf))].map(b => b.toString(16).padStart(2, "0")).join("");
  if (songs.some(s => s.hash === hash)) { us.textContent = "Duplicate: already in library"; $("go").disabled = false; return; }
  let bin = "", u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  us.textContent = "Uploading... please wait";
  const j = await call("upload", { data: btoa(bin), hash, mime: f.type, ext: (f.name.split(".").pop() || "mp3"), title: $("ti").value, artist: $("ar").value, language: $("ul").value, genre: $("ug").value, visibility: $("uv").value });
  $("go").disabled = false;
  if (!j.ok) { us.textContent = j.error; return; }
  songs.push(j.song); render(); us.textContent = ""; $("file").value = ""; $("dlg").close();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
if (token) start(); else $("auth").classList.remove("hide");
</script>
</body></html>
